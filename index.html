<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Pony Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
  /* корзина: шторка снизу, видна ТОЛЬКО при .show */
  #cartDrawer{
    position: fixed !important;
    left: 50% !important;
    right: auto !important;
    top: auto !important;
    bottom: 0 !important;
    width: 100% !important;
    max-width: 480px !important;
    height: auto !important;
    max-height: 85vh !important;
    border-left: none !important;
    border-right: none !important;
    border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    z-index: 41;
    display: flex;
    flex-direction: column;
    transform: translate(-50%, 100%) !important;
    visibility: hidden !important;
    pointer-events: none !important;
    transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s !important;
  }
  #cartDrawer.show{
    transform: translate(-50%, 0) !important;
    visibility: visible !important;
    pointer-events: auto !important;
    transition: transform .28s cubic-bezier(.2,.8,.2,1) !important;
  }
  #cartDrawer .panel-body{ flex:1 1 auto; overflow-y:auto; }
  #cartDrawer .cart-foot{ flex-shrink:0; }
</style>

</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="stage">
    <img class="wordmark" src="assets/splash/splash_1.png" alt="">
    <div class="half left"><img class="pony eqg" src="assets/splash/splash_2.png" alt=""></div>
    <div class="half right"><img class="pony mlp" src="assets/splash/splash_3.png" alt=""></div>
  </div>
</div>

<div class="app">
  <div class="hero"></div>

  <header class="header-card">
    <div class="tb-row">
      <div class="brand">
        <div class="brand-mark">
          <img src="assets/splash/splash_4.png" alt="">
        </div>
        <div>
          <div class="brand-name">The Pony Store</div>
          <div class="brand-sub">каталог персонажей и декора</div>
        </div>
      </div>
      <button class="cart-btn" id="cartBtn" aria-label="Корзина">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h2l2.2 11.2a1.6 1.6 0 0 0 1.6 1.3h8.4a1.6 1.6 0 0 0 1.6-1.3L21 8H7"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg>
        <span class="cart-dot" id="cartCount">0</span>
      </button>
    </div>

    <div class="subbar" id="subbar">
      <button class="cat-select" id="catSelect">
        <span>
          <span class="k">Категория</span>
          <span class="v" id="catSelectVal">Пони <em>2355</em></span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <div class="search-line" id="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Название или город…">
        <button class="search-clear" id="searchClear" aria-label="Очистить">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="min-order-note">Минимальная сумма заказа — <b>200 ₽</b></div>
  </header>

  <div class="content" id="content"></div>
</div>

<nav class="tabbar" id="segment">
  <button class="seg active" data-nav="topup">Комбо</button>
  <button class="seg" data-nav="catalog">Каталоги</button>
  <button class="seg" data-nav="build">Конструктор</button>
  <span class="seg-ink" id="segInk"></span>
</nav>

<button class="top-btn" id="topBtn" aria-label="Наверх">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
</button>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="catSheet">
  <div class="grip"></div>
  <div class="panel-head">
    <h3>Категория</h3>
    <button class="icon-btn" id="catSheetClose" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-body" id="catSheetBody"></div>
</div>

<div class="sheet" id="cartDrawer">
  <div class="grip"></div>
  <div class="panel-head">
    <button class="icon-btn" id="cartCloseBtn" aria-label="Назад">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
    </button>
    <h3>Заказ</h3>
    <span class="count" id="cartHeadCount"></span>
  </div>
  <div class="panel-body" id="cartBody"></div>
  <div class="cart-foot" id="cartFoot"></div>
</div>


<script src="data-main.js"></script>
<script src="data-topups.js"></script>
<script src="data-build.js"></script>
<script src="app.js"></script>

</body>
</html>
